services:
  products-service:
    build:
      context: .
      dockerfile: services/products-service/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - PORT=3001

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - '3002:3002'
    environment:
      - PORT=3002

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    ports:
      - '3003:3003'
    environment:
      - PORT=3003

  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    ports:
      - '3004:3004'
    environment:
      - PORT=3004
      - PRODUCTS_SERVICE_URL=http://products-service:3001
    depends_on:
      - products-service

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - PRODUCTS_SERVICE_URL=http://products-service:3001
      - AUTH_SERVICE_URL=http://auth-service:3002
      - CART_SERVICE_URL=http://cart-service:3003
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:3004
    depends_on:
      - products-service
      - auth-service
      - cart-service
      - recommendation-service

  client:
    build: ./client
    ports:
      - '3005:3000'
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:3000/api
    depends_on:
      - api-gateway
